[package]
name = "wayluck"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "A Wayland compositor that leaves placement to a separate window manager"

[dependencies]
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# The window manager protocol's server side, generated from its XML at build
# time; the same versions smithay uses.
wayland-server = "0.31.14"
wayland-backend = "0.3.17"
wayland-scanner = "0.31.11"
bitflags = "2.13.2"

[dependencies.smithay]
version = "0.7.0"
default-features = false
features = ["backend_winit", "wayland_frontend", "desktop"]
