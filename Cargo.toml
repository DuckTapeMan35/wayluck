[package]
name = "wayluck"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "A Wayland compositor that leaves placement to a separate window manager"

[dependencies]
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
rustix = { version = "1.1.6", features = ["process", "net", "fs"] }
wayland-server = "0.31.14"
wayland-backend = "0.3.17"
wayland-scanner = "0.31.11"
bitflags = "2.13.2"
xcursor = "0.3.11"
fontdue = "0.9.5"
wayland-protocols = { version = "0.32.13", features = ["server", "staging"] }

[dev-dependencies]
# The tests' Wayland clients.
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
# The tests' X clients: what an X program can do.
x11rb = { version = "0.14.0", features = ["xinput", "shm"] }

[[test]]
name = "security"
required-features = ["test-harness"]

[[test]]
name = "attackers"
required-features = ["test-harness"]

[[test]]
name = "x_windows"
required-features = ["test-harness"]

[[test]]
name = "robustness"
required-features = ["test-harness"]

[[test]]
name = "picker"
required-features = ["test-harness"]

[[test]]
name = "capture"
required-features = ["test-harness"]

[[test]]
name = "animations"
required-features = ["test-harness"]

[[test]]
name = "shadows"
required-features = ["test-harness"]

[[test]]
name = "blur"
required-features = ["test-harness"]

[[test]]
name = "layers"
required-features = ["test-harness"]

[[test]]
name = "x_hints"
required-features = ["test-harness"]

[features]
# For wayluck's tests (tests/): a headless backend (--headless), and later
# a way for tests to drive input. Never in a build that's installed.
test-harness = []

# smithay's master: 0.7.0 (the latest release) names the root window as
# the active X window, and Wine games then minimize themselves. Pinned to a
# commit; back to a release once one has the fix.
[dependencies.smithay]
git = "https://github.com/Smithay/smithay.git"
rev = "f581531d479cf2e3307bafb913c5d2bb12860bb3"
default-features = false
features = [
  "xwayland",
  "backend_winit",
  "backend_drm",
  "backend_gbm",
  "backend_libinput",
  "backend_session_libseat",
  "backend_udev",
  "renderer_multi",
  "wayland_frontend",
  "desktop",
]
