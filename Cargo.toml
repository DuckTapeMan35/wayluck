[package]
name = "wayluck"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "A Wayland compositor that leaves placement to a separate window manager"

[dependencies]
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
wayland-server = "0.31.14"
wayland-backend = "0.3.17"
wayland-scanner = "0.31.11"
wayland-client = "0.31.15"
bitflags = "2.13.2"
xcursor = "0.3.11"
fontdue = "0.9.5"
wayland-protocols = { version = "0.32.13", features = ["client", "server", "staging"] }

[dependencies.smithay]
version = "0.7.0"
default-features = false
features = [
  "backend_winit",
  "backend_drm",
  "backend_gbm",
  "backend_libinput",
  "backend_session_libseat",
  "backend_udev",
  "renderer_multi",
  "wayland_frontend",
  "desktop",
]
